<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Subby — a calm subscription tracker. Demos and app flow." />
    <meta name="theme-color" content="#080b10" />
    <title>Subby</title>
    <style>
      :root {
        --surface: #080b10;
        --surface-raised: #0e141c;
        --border: #243243;
        --text: #f4f7fb;
        --text-secondary: #93a1b5;
        --accent: #22d3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(circle at 12% 0%, rgb(34 211 238 / 10%), transparent 30rem),
          var(--surface);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }

      main {
        padding: 3rem 1.5rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 auto 2.5rem;
        max-width: 34rem;
        color: var(--text-secondary);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      a.card {
        display: block;
        min-width: 14rem;
        padding: 1.25rem 1.75rem;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        text-decoration: none;
        transition: border-color 0.15s ease;
      }

      a.card:hover,
      a.card:focus-visible {
        border-color: var(--accent);
      }

      .card strong {
        display: block;
        margin-bottom: 0.25rem;
      }

      .card span {
        color: var(--text-secondary);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Subby</h1>
      <p>A calm subscription tracker for recurring spend.</p>
      <nav>
        <a class="card" href="demo/">
          <strong>Product tour</strong>
          <span>Watch the demos (WebM/MP4)</span>
        </a>
        <a class="card" href="app-flow.html">
          <strong>App flow</strong>
          <span>Animated diagram of how the app works</span>
        </a>
      </nav>
    </main>
  </body>
</html>
