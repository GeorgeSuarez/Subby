# Android development/preview APK: auth entry, sign-in, and stable app-scheme route.
# Preconditions: local Supabase is running and the APK is installed.
appId: com.subby.app
---
- launchApp: com.subby.app
- openLink: subby://auth/sign-in
- extendedWaitUntil:
    visible: 'Sign in'
    timeout: 60000
- assertVisible: 'Track every subscription, all in one place.'
- assertVisible: 'Show password'
- tapOn: 'you@example.com'
- inputText: 'test@subby.app'
- tapOn: 'Your password'
- inputText: 'subby123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 120000
- openLink: subby://reset-password
- extendedWaitUntil:
    visible: 'Reset your password|Choose a new password'
    timeout: 30000
