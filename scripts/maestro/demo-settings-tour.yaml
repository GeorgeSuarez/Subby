# Demo: Settings tour — theme, currency, budget, reminders, account, demo data.
# Precondition: dashboard at top (run demo-warmup first).
# Record under: xcrun simctl io booted recordVideo demo-settings.mp4
# Non-destructive: theme cycles Light→Dark→System and returns to System before exit.
appId: host.exp.Exponent
---
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Theme"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 700

# Theme screen — tap through chips (System is selected by default).
- tapOn: "Theme"
- extendedWaitUntil:
    visible: "Light"
    timeout: 10000
- tapOn: "Light"
- waitForAnimationToEnd:
    timeout: 800
- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 800
- tapOn: "System"
- waitForAnimationToEnd:
    timeout: 800

# Back to the hub (iOS edge-swipe pop) — Currency / Budget rows.
- swipe:
    start: '2%,50%'
    end: '50%,50%'
    duration: 400
- extendedWaitUntil:
    visible: "Currency"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 700
- assertVisible: "Currency"
- assertVisible: "Budget"
- waitForAnimationToEnd:
    timeout: 500

# Notifications screen — renewal toggle state.
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "Renewal reminders"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 700
- assertVisible: "Renewal reminders"

# Back to the hub, then into Demo data — end of the menu is the most demo-worthy footer.
- swipe:
    start: '2%,50%'
    end: '50%,50%'
    duration: 400
- extendedWaitUntil:
    visible: "Demo data"
    timeout: 15000
- tapOn: "Demo data"
- extendedWaitUntil:
    visible: "4 demo subscriptions loaded"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1000

# Back to the hub, then return to dashboard cleanly.
- swipe:
    start: '2%,50%'
    end: '50%,50%'
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- tapOn: "Dashboard"
- extendedWaitUntil:
    visible: "Monthly spend"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 700
