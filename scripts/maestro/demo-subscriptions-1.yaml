# Demo recording, part 1: subscriptions list — sort by Cost (the rows
# reorder by price), then search for Netflix (typed one character at a time
# so the live filtering is visible). Ends on the single filtered row, ready
# for part 2 to open it. Run under `xcrun simctl io booted recordVideo`.
# Precondition: the app sits on the Dashboard tab (run demo-warmup first).
appId: host.exp.Exponent
---
# Warmup leaves the app on the Dashboard; switch tabs immediately.
- tapOn: 'Subscriptions'
- extendedWaitUntil:
    visible: 'Search subscriptions'
    timeout: 30000
# Sort by Cost — the rows reorder by monthly price (descending).
- tapOn: 'Cost'
- waitForAnimationToEnd:
    timeout: 800
# Bring the search field back into view after the reorder.
- swipe:
    start: 50%, 30%
    end: 50%, 60%
    duration: 400
- waitForAnimationToEnd:
    timeout: 2500
# Search "netflix" — one character at a time, small delay per key.
- tapOn:
    point: 50%, 11%
- eraseText: 50
- inputText: 'n'
- waitForAnimationToEnd:
    timeout: 120
- inputText: 'e'
- waitForAnimationToEnd:
    timeout: 120
- inputText: 't'
- waitForAnimationToEnd:
    timeout: 120
- inputText: 'f'
- waitForAnimationToEnd:
    timeout: 120
- inputText: 'l'
- waitForAnimationToEnd:
    timeout: 120
- inputText: 'i'
- waitForAnimationToEnd:
    timeout: 120
- inputText: 'x'
- extendedWaitUntil:
    visible: '1 shown'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1200
