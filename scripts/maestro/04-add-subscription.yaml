# Add a subscription via the modal form and verify the save toast.
appId: host.exp.Exponent
---
- launchApp: host.exp.Exponent
- openLink: exp://127.0.0.1:8081
# Native tab state survives deep-link launches in Expo Go. Return to the
# dashboard before checking the signed-in precondition.
- runFlow:
    when:
      visible: 'Subscriptions'
    commands:
      - tapOn: 'Dashboard'
      - swipe:
          start: '50%,20%'
          end: '50%,80%'
- extendedWaitUntil:
    visible: 'Sign in|Monthly spend'
    timeout: 180000
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'you@example.com'
      - eraseText
      - inputText: 'test@subby.app'
      - tapOn: 'Your password'
      - eraseText
      - inputText: 'subby123'
      - pressKey: Enter
- runFlow:
    when:
      visible: 'Save Password?'
    commands:
      - tapOn: 'Not Now'
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'you@example.com'
      - eraseText
      - inputText: 'test@subby.app'
      - tapOn: 'Your password'
      - eraseText
      - inputText: 'subby123'
      - pressKey: Enter
- runFlow:
    when:
      visible: 'Save Password?'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 180000
- openLink: exp://127.0.0.1:8081/--/subscription/add
- extendedWaitUntil:
    visible: 'New subscription'
    timeout: 60000
- tapOn: 'e.g. Netflix'
- inputText: 'Apple One'
- tapOn: '0.00'
- inputText: '19.95'
- swipe:
    start: '50%,30%'
    end: '50%,8%'
- extendedWaitUntil:
    visible: 'Renewal reminder, plan details…'
    timeout: 15000
- tapOn: 'Renewal reminder, plan details…'
- inputText: 'iCloud family plan'
- swipe:
    start: '50%,30%'
    end: '50%,10%'
- takeScreenshot: add-subscriptions
- extendedWaitUntil:
    visible: 'Add subscription'
    timeout: 15000
- tapOn:
    id: 'add-submit'
- runFlow:
    when:
      visible: "Don't Allow"
    commands:
      - tapOn: "Don't Allow"
- assertVisible:
    text: 'Subscription added'
    optional: true
