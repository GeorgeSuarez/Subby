# Sign in as the demo account (post keychain reset).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Sign in'
    timeout: 60000
- tapOn: 'you@example.com'
- inputText: 'test@subby.app'
- tapOn: 'Your password'
- inputText: 'subby123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 120000
