# Verify-password flow: wrong password rejected, correct password proceeds.
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081/--/verify-password
- extendedWaitUntil:
    visible: 'Verify your password'
    timeout: 60000
- takeScreenshot: verify
- tapOn: 'Your current password'
- inputText: 'wrongpass'
- tapOn:
    id: 'verify-submit'
- extendedWaitUntil:
    visible: 'Current password is incorrect.'
    timeout: 30000
- tapOn: 'Your current password'
- eraseText
- inputText: 'subby123'
- tapOn:
    id: 'verify-submit'
- extendedWaitUntil:
    visible: 'Set a new password'
    timeout: 60000
