# Demo recording, take 2: scroll the whole dashboard from the top —
# renewals, categories, 12-month forecast, then quick stats at the bottom.
# Splices onto take 1 (refresh), which ends on the same top-of-dashboard frame.
# The dashboard occasionally measures its scroll content short (an RN bug
# triggered by the refresh re-render), cutting off the bottom cards. The
# scroll-to-bottom-then-top "jiggle" below forces a fresh full re-measure; the
# jiggle footage is trimmed out in post.
# Precondition: the app sits at the top of the dashboard.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000
# Jiggle: scroll to the bottom and back to force a clean content re-measure.
- repeat:
    times: 6
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 20%
          duration: 500
      - waitForAnimationToEnd:
          timeout: 400
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 75%
          duration: 300
      - waitForAnimationToEnd:
          timeout: 400
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 30000
# The scroll-up above may overshoot into a pull-to-refresh, which locks the
# scroll view while it runs; wait it out before the real scroll.
- waitForAnimationToEnd:
    timeout: 8000
# The real scroll: 14 drags to the bottom (excess drags hit the rubber-band),
# then the bottom section is asserted on screen.
- repeat:
    times: 14
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 20%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 500
- extendedWaitUntil:
    visible: 'Quick stats'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
