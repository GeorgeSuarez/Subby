# Open the Netflix detail screen, verify it, and edit the amount.
# Navigate through the list rather than embedding a local-DB-specific UUID.
appId: host.exp.Exponent
---
# Clear any stale formSheet/modal stack left by a previous flow without
# clearing the signed-in session or local data.
- launchApp: host.exp.Exponent
- openLink: exp://127.0.0.1:8081/--/subscriptions
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'you@example.com'
      - eraseText
      - inputText: 'test@subby.app'
      - tapOn: 'Your password'
      - eraseText
      - inputText: 'subby123'
      - pressKey: Enter
- runFlow:
    when:
      visible: 'Save Password?'
    commands:
      - tapOn: 'Not Now'
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'you@example.com'
      - eraseText
      - inputText: 'test@subby.app'
      - tapOn: 'Your password'
      - eraseText
      - inputText: 'subby123'
      - pressKey: Enter
- runFlow:
    when:
      visible: 'Save Password?'
    commands:
      - tapOn: 'Not Now'
- runFlow:
    when:
      visible: 'Monthly spend'
    commands:
      - tapOn: 'Subscriptions'
- extendedWaitUntil:
    visible: '.*Netflix.*'
    timeout: 180000
- tapOn: '.*Netflix.*'
- extendedWaitUntil:
    visible: 'Effective cost'
    timeout: 60000
- takeScreenshot: detail
- tapOn: 'Edit subscription'
- extendedWaitUntil:
    visible: 'Edit subscription'
    timeout: 60000
- tapOn: '15.99|16.99'
- eraseText
- inputText: '16.99'
- swipe:
    start: '50%,30%'
    end: '50%,10%'
- swipe:
    start: '50%,30%'
    end: '50%,12%'
- tapOn:
    id: 'add-submit'
- extendedWaitUntil:
    visible: 'Effective cost'
    timeout: 60000
- assertVisible:
    text: '.*16.99.*'
    optional: true
