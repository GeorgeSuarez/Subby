# Demo recording: dashboard showcase. Holds briefly on the hero — cycle
# progress dot, budget progress — then scrolls through renewals, active
# trials, the category pie, insight strip, forecast and quick stats, and
# flicks back up to the hero. Pull-to-refresh is intentionally not showcased.
# Kept short: fast gestures, minimal holds. Run under
# `xcrun simctl io booted recordVideo`. Precondition: app cold-launched and
# sitting at the top of the dashboard (run demo-warmup first).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 800
# Three passes cover the dashboard sections without replaying empty scroll.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 20%
          duration: 600
- waitForAnimationToEnd:
    timeout: 500
# Flick back up to the top.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 75%
          duration: 200
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 30000
# Settle at the top so the recording ends cleanly (no pull-to-refresh).
- waitForAnimationToEnd:
    timeout: 1000
