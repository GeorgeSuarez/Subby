# Demo recording, refresh take: pull-to-refresh at the top of the dashboard.
# A fresh hydrate takes a few seconds against the local stack, so hold still
# until the count-up settles. Splices onto the smooth-scroll take, which
# starts from the same top-of-dashboard frame.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 60000
- swipe:
    start: 50%, 18%
    end: 50%, 60%
    duration: 1400
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
