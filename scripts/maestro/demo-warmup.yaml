# Warm up: cold-launch the app and land on the top of the dashboard (outside
# the recording). A fresh launch starts at scroll position 0 — no swiping, so
# no accidental pull-to-refresh.
appId: host.exp.Exponent
---
- killApp
- openLink: exp://127.0.0.1:8081
- runFlow:
    when:
      visible: 'Source code explorer'
    commands:
      - tapOn: 'Close'
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'you@example.com'
      - inputText: 'test@subby.app'
      - tapOn: 'Your password'
      - eraseText: 100
      - inputText: 'subby123'
      - pressKey: Enter
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 120000
# Warm up a pull-to-refresh so the recorded refresh (a fresh hydrate) is fast.
- swipe:
    start: 50%, 18%
    end: 50%, 60%
    duration: 1400
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 30000
