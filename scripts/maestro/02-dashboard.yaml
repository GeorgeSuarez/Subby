# Open the app; sign in as the demo account if needed; verify the dashboard.
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'you@example.com'
      - eraseText
      - inputText: 'test@subby.app'
      - tapOn: 'Your password'
      - eraseText
      - inputText: 'subby123'
      - pressKey: Enter
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 180000
- assertVisible: 'Upcoming renewals · next 30 days'
- assertVisible: 'By category'
- takeScreenshot: dashboard
