# Demo recording: add a subscription — type the name, type the amount, then
# pick a category from the picker sheet. The form auto-scrolls the focused
# field above the keyboard, so no manual scrolling is needed. Run under
# `xcrun simctl io booted recordVideo`. Precondition: the app sits on the
# Dashboard tab.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 30000
- tapOn: 'Add subscription'
- extendedWaitUntil:
    visible: 'Amount'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1500
# Type the name (one character at a time so the typing is visible on film).
- tapOn: 'e.g. Netflix'
- inputText: 'h'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'b'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'o'
- waitForAnimationToEnd:
    timeout: 400
- inputText: ' '
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'm'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'a'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'x'
- waitForAnimationToEnd:
    timeout: 600
# Type the amount.
- tapOn: '0.00'
- inputText: '1'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '6'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '.'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '9'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '9'
- waitForAnimationToEnd:
    timeout: 800
# The keyboard covers the category field. The form's ScrollView has
# keyboardDismissMode="on-drag", so a drag on the form dismisses the
# keyboard; then the category field sits at its natural ~86% position.
- swipe:
    start: 50%, 40%
    end: 50%, 68%
    duration: 800
- waitForAnimationToEnd:
    timeout: 1500
# Pick a category from the picker sheet. The sheet rows are unreliable to
# select by text (native-modal a11y lag), so both the field and the first
# row (Streaming, at 22% of the screen height) are tapped by point.
- tapOn:
    point: 50%, 86%
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: 50%, 22%
- waitForAnimationToEnd:
    timeout: 2500
