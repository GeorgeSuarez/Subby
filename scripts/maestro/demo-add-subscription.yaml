# Demo recording: add a subscription end-to-end — type the name "HBO Max",
# type the amount, pick the renewal date Sep 11 2026 with the date spinner,
# pick the category with the picker sheet, submit, and land on the dashboard
# with the success toast. Run under `xcrun simctl io booted recordVideo`.
# Precondition: the app sits on the Dashboard tab.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 30000
- tapOn: 'Add subscription'
- extendedWaitUntil:
    visible: 'Amount'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1500
# Type the name "HBO Max" (one character at a time so the typing is visible).
- tapOn: 'e.g. Netflix'
- inputText: 'H'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'B'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'O'
- waitForAnimationToEnd:
    timeout: 400
- inputText: ' '
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'M'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'a'
- waitForAnimationToEnd:
    timeout: 400
- inputText: 'x'
- waitForAnimationToEnd:
    timeout: 600
# Type the amount.
- tapOn: '0.00'
- inputText: '1'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '6'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '.'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '9'
- waitForAnimationToEnd:
    timeout: 400
- inputText: '9'
- waitForAnimationToEnd:
    timeout: 800
# Dismiss the keyboard (on-drag) so the form returns to its natural layout.
- swipe:
    start: 50%, 40%
    end: 50%, 68%
    duration: 800
- waitForAnimationToEnd:
    timeout: 1500
# Pick the renewal date with the spinner. Default is Sep 14 (today + 1
# month); each calibrated drag moves the day wheel one row, so three drags
# land on Sep 11. The sheet's controls are invisible to the a11y tree, so
# the wheel, Done (sheet header, right) are tapped/dragged by point.
- tapOn:
    point: 50%, 53%
- waitForAnimationToEnd:
    timeout: 2500
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 81%
          end: 50%, 85%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1500
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: 87%, 70%
- waitForAnimationToEnd:
    timeout: 2000
# Pick the category: Streaming is the sheet's first row.
- tapOn:
    point: 50%, 86%
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: 50%, 22%
- waitForAnimationToEnd:
    timeout: 1500
# Scroll the form down to the submit button.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 30%
          duration: 500
      - waitForAnimationToEnd:
          timeout: 400
# Submit: the success toast appears, the modal closes, and the dashboard
# shows the new subscription.
- tapOn: 'Add subscription'
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3500
