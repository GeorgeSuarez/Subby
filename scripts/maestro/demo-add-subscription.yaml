# Demo recording: add a subscription end-to-end — name, amount, renewal
# date, category, notes, then the saved detail screen. The form uses normal
# field entry for a shorter recording; pauses are reserved for native pickers
# and screen transitions.
# Precondition: the app sits on the Dashboard tab (run demo-warmup first).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 30000
- tapOn: 'Add subscription'
- extendedWaitUntil:
    visible: 'Amount'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 800
- tapOn: 'e.g. Netflix'
- inputText: 'HBO Max'
- tapOn: '0.00'
- inputText: '16.99'
# Dismiss the keyboard so the native pickers use their stable screen positions.
- swipe:
    start: 50%, 40%
    end: 50%, 68%
    duration: 600
- waitForAnimationToEnd:
    timeout: 600
# Pick a nearby renewal date with the spinner.
- tapOn:
    point: 50%, 53%
- waitForAnimationToEnd:
    timeout: 500
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 81%
          duration: 500
- tapOn:
    point: 87%, 70%
- waitForAnimationToEnd:
    timeout: 500
# Pick Streaming from the category sheet.
- tapOn:
    point: 50%, 86%
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: 50%, 22%
- waitForAnimationToEnd:
    timeout: 500
# Scroll to Notes, enter the description, and reach Submit.
- repeat:
    times: 2
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 35%
          duration: 500
- tapOn: 'Renewal reminder, plan details…'
- inputText: 'Ad-free trial'
- swipe:
    start: 50%, 40%
    end: 50%, 68%
    duration: 600
- repeat:
    times: 2
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 30%
          duration: 400
- tapOn: 'Add subscription'
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
# Open the saved subscription detail screen.
- tapOn: 'Subscriptions'
- extendedWaitUntil:
    visible: 'Search subscriptions'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*HBO Max.*'
    timeout: 15000
- tapOn:
    text: '.*HBO Max.*'
- extendedWaitUntil:
    visible: 'Effective cost'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1200
