# Re-seed the demo data: sign out (settings → Sign out), then sign back in
# as the test account, which auto-loads the current seed set (see
# `src/db/seed-data.ts`). Used to regenerate demo recordings against a clean
# data slate. Precondition: app is signed in on any tab.
appId: host.exp.Exponent
---
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Sign out'
    timeout: 30000
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Sign in'
    timeout: 60000
- tapOn: 'you@example.com'
- inputText: 'test@subby.app'
- tapOn: 'Your password'
- inputText: 'subby123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Monthly spend'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
